name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-outbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: bot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_outbox_persistence.py -v
        env:
          BOT_OUTBOX_TEST_URL: postgresql://bot_ci:disposable_ci_only@localhost:5432/bot_ci
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m unittest discover -s tests -v
